name: Generate Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import json
          import urllib.request
          import os
          from datetime import datetime, timedelta

          username = "BekkamMallishwari"
          token = os.environ["GH_TOKEN"]

          end = datetime.utcnow()
          start = end - timedelta(days=30)

          query = """
          query($login: String!, $from: DateTime!, $to: DateTime!) {
            user(login: $login) {
              contributionsCollection(from: $from, to: $to) {
                contributionCalendar {
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """

          variables = {
              "login": username,
              "from": start.isoformat() + "Z",
              "to": end.isoformat() + "Z"
          }

          data = json.dumps({
              "query": query,
              "variables": variables
          }).encode()

          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=data,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json"
              }
          )

          with urllib.request.urlopen(request) as response:
              result = json.load(response)

          weeks = result["data"]["user"]["contributionsCollection"]["contributionCalendar"]["weeks"]

          contributions = []

          for week in weeks:
              for day in week["contributionDays"]:
                  contributions.append({
                      "date": day["date"],
                      "count": day["contributionCount"]
                  })

          contributions = contributions[-30:]

          width = 1100
          height = 430

          left = 75
          right = 30
          top = 90
          bottom = 75

          graph_width = width - left - right
          graph_height = height - top - bottom

          max_count = max([x["count"] for x in contributions] or [1])
          max_count = max(max_count, 1)

          points = []

          for i, item in enumerate(contributions):
              x = left + (i / max(len(contributions) - 1, 1)) * graph_width
              y = top + graph_height - (item["count"] / max_count) * graph_height
              points.append((x, y))

          line_points = " ".join(
              f"{x:.1f},{y:.1f}" for x, y in points
          )

          y_lines = 8

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg"
              width="{width}"
              height="{height}"
              viewBox="0 0 {width} {height}">

            <rect width="100%" height="100%" rx="14" fill="#0d1117"/>

            <text
              x="{width / 2}"
              y="35"
              text-anchor="middle"
              fill="#58a6ff"
              font-family="Arial, sans-serif"
              font-size="20"
              font-weight="bold">
              {username}'s Contribution Graph
            </text>

            <text
              x="{left}"
              y="65"
              fill="#8b949e"
              font-family="Arial, sans-serif"
              font-size="13">
              Contributions
            </text>
          '''

          # Horizontal grid
          for i in range(y_lines + 1):
              value = round(max_count * i / y_lines)
              y = top + graph_height - (i / y_lines) * graph_height

              svg += f'''
              <line
                x1="{left}"
                y1="{y:.1f}"
                x2="{width-right}"
                y2="{y:.1f}"
                stroke="#30363d"
                stroke-width="1"/>

              <text
                x="{left-12}"
                y="{y+4:.1f}"
                text-anchor="end"
                fill="#8b949e"
                font-family="Arial, sans-serif"
                font-size="11">
                {value}
              </text>
              '''

          # Vertical grid
          for i in range(len(contributions)):
              x = left + (i / max(len(contributions) - 1, 1)) * graph_width

              svg += f'''
              <line
                x1="{x:.1f}"
                y1="{top}"
                x2="{x:.1f}"
                y2="{top+graph_height}"
                stroke="#21262d"
                stroke-width="1"/>
              '''

          # Area under graph
          area_points = (
              f"{left},{top+graph_height} "
              + line_points
              + f" {width-right},{top+graph_height}"
          )

          svg += f'''
            <polygon
              points="{area_points}"
              fill="#238636"
              opacity="0.15"/>

            <polyline
              points="{line_points}"
              fill="none"
              stroke="#39d353"
              stroke-width="4"
              stroke-linecap="round"
              stroke-linejoin="round"/>
          '''

          # Points
          for i, (x, y) in enumerate(points):
              count = contributions[i]["count"]

              svg += f'''
              <circle
                cx="{x:.1f}"
                cy="{y:.1f}"
                r="5"
                fill="#39d353"
                stroke="#0d1117"
                stroke-width="2">
                <title>
                  {contributions[i]["date"]}: {count} contributions
                </title>
              </circle>
              '''

          # X-axis labels
          label_indexes = [0, 5, 10, 15, 20, 25, len(contributions)-1]

          for i in label_indexes:
              if i >= len(contributions):
                  continue

              x = left + (i / max(len(contributions) - 1, 1)) * graph_width
              date = contributions[i]["date"]

              svg += f'''
              <text
                x="{x:.1f}"
                y="{top+graph_height+30}"
                text-anchor="middle"
                fill="#8b949e"
                font-family="Arial, sans-serif"
                font-size="11">
                {date[5:]}
              </text>
              '''

          svg += f'''
            <text
              x="{width/2}"
              y="{height-15}"
              text-anchor="middle"
              fill="#8b949e"
              font-family="Arial, sans-serif"
              font-size="12">
              Date
            </text>

          </svg>
          '''

          with open("github-metrics.svg", "w", encoding="utf-8") as f:
              f.write(svg)

          print("Contribution graph generated successfully.")
          PY

      - name: Commit graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add github-metrics.svg

          git diff --cached --quiet || git commit -m "Update contribution graph"

          git push
