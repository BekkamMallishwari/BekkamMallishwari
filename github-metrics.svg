name: GitHub Telemetry

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  telemetry:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # ─────────────────────────────────────────
      # 📊 GitHub Statistics
      # ─────────────────────────────────────────

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&theme=tokyonight&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ─────────────────────────────────────────
      # 💻 Most Used Languages
      # ─────────────────────────────────────────

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&theme=tokyonight&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ─────────────────────────────────────────
      # 🔥 Contribution Streak
      # ─────────────────────────────────────────

      - name: Generate Contribution Streak
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: username=${{ github.repository_owner }}&theme=tokyonight&hide_border=true
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ─────────────────────────────────────────
      # 📈 Contribution Activity Graph
      # ─────────────────────────────────────────

      - name: Generate Activity Graph
        uses: lowlighter/metrics@latest
        with:
          filename: profile/activity.svg
          token: ${{ secrets.GITHUB_TOKEN }}

          base: ""

          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: graph

          plugin_habits_days: 30
          plugin_habits_from: 200

      # ─────────────────────────────────────────
      # ⏱️ Coding Time / Coding Habits
      # ─────────────────────────────────────────

      - name: Generate Coding Time
        uses: lowlighter/metrics@latest
        with:
          filename: profile/coding-time.svg
          token: ${{ secrets.GITHUB_TOKEN }}

          base: ""

          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: no

          plugin_habits_days: 30
          plugin_habits_from: 200

      # ─────────────────────────────────────────
      # 💾 Commit Generated Images
      # ─────────────────────────────────────────

      - name: Commit generated telemetry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          git diff --cached --quiet || git commit -m "Update GitHub telemetry"

          git push
